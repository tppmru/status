<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Статус сервисов Технополиса</title>
  <style>
    body {
      margin: 0;
      color: CanvasText;
      background: Canvas;
      font: 1rem/1.55 system-ui, sans-serif;
    }
    main {
      max-inline-size: 38rem;
      margin: auto;
      padding: clamp(1rem, 7vw, 4.5rem) 1rem;
    }
    h1 {
      margin: 0 0 .75rem;
      font-size: clamp(1.6rem, 5vw, 2.5rem);
      line-height: 1.15;
    }
    ul {
      margin: 1.5rem 0 0;
      padding: 0 1rem;
      list-style: none;
      border: 1px solid GrayText;
      border-radius: .75rem;
    }
    li {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: .25rem 1rem;
      padding: .75rem 0;
    }
    li + li { border-block-start: 1px solid GrayText; }
  </style>
</head>
<body>
  <main>
    <h1>Статус сервисов Технополиса</h1>
    <p>Мониторинг настраивается. Статус и история проверок появятся после запуска Upptime.</p>
    <ul aria-label="Сервисы">
      <li><strong>Frontend</strong><span>Ожидает проверки</span></li>
      <li><strong>Backend</strong><span>Ожидает проверки</span></li>
      <li><strong>ServiceDesk On-Premise</strong><span>Ожидает проверки</span></li>
    </ul>
  </main>
</body>
</html>
