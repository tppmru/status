owner: tppmru
repo: status
user-agent: tppmru-status

secrets:
  - SDP_PROBE_URL
  - SDP_PROBE_TOKEN

skipDeleteIssues: true
skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true

sites:
  - name: Frontend
    url: https://tma.tppm.ru/
    maxRedirects: 0
    connectTimeout: 5
    requestTimeout: 10
    maxRetries: 1
    expectedStatusCodes: [200]
    __dangerous__body_down_if_regex_missing: '^(?=[\s\S]*<title>\s*Технополис бот поддержки\s*</title>)(?=[\s\S]*<div\b[^>]*\s+id\s*=\s*"app"(?:\s|/?>))'
  - name: Backend
    url: https://tma.tppm.ru/api/docs/openapi.json
    maxRedirects: 0
    connectTimeout: 5
    requestTimeout: 10
    maxRetries: 1
    expectedStatusCodes: [200]
    __dangerous__body_down_if_regex_missing: '^(?=[\s\S]*"openapi"\s*:\s*"[^"]+")(?=[\s\S]*"paths"\s*:\s*\{[\s\S]*"/api/statuses"\s*:\s*\{)'
  - name: ServiceDesk On-Premise
    url: $SDP_PROBE_URL
    icon: https://tppmru.github.io/status/status-icon.svg
    headers:
      - 'Accept: application/vnd.manageengine.sdp.v3+json'
      - 'authtoken: $SDP_PROBE_TOKEN'
    maxRedirects: 0
    connectTimeout: 5
    requestTimeout: 10
    maxRetries: 1
    expectedStatusCodes: [200]
    __dangerous__body_down_if_regex_missing: '^(?=[\s\S]*"response_status"\s*:\s*\{[^{}]*"status_code"\s*:\s*2000\s*[,}])(?=[\s\S]*"subject"\s*:\s*"TPPM-STATUS-PROBE")'

status-website:
  baseUrl: /status
  name: Статус сервисов Технополиса
  logoUrl: https://tppmru.github.io/status/status-icon.svg
  faviconSvg: https://tppmru.github.io/status/status-icon.svg
  introTitle: Статус сервисов Технополиса
  introMessage: GitHub Actions проверяет доступность сервисов каждые пять минут. Проверки по расписанию могут запускаться с задержкой.
  navbar:
    - title: Статус
      href: /
    - title: GitHub
      href: https://github.com/tppmru/status

